name: Build and Release NovelFlow

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      KEY_ALIAS: ${{ secrets.NOVELFLOW_KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.NOVELFLOW_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.NOVELFLOW_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Prepare release keystore
        shell: bash
        run: |
          if [[ -z "${{ secrets.NOVELFLOW_KEYSTORE_BASE64 }}" ]]; then
            echo "NOVELFLOW_KEYSTORE_BASE64 secret is required for release builds."
            exit 1
          fi
          echo "${{ secrets.NOVELFLOW_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew :app:buildReleaseApk

      - name: Verify APK
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APK="apk/NovelFlow-v${TAG}.apk"
          test -f "$APK" || { echo "Release APK not found: $APK"; exit 1; }
          unzip -t "$APK" >/dev/null

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovelFlow-${{ github.ref_name }}
          path: apk/NovelFlow-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apk/NovelFlow-*.apk
          name: NovelFlow ${{ github.ref_name }}
