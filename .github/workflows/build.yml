name: Build and Release NovelRegEx

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      KEY_ALIAS: ${{ secrets.NovelRegEx_KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.NovelRegEx_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.NovelRegEx_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify release tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(sed -n 's/^app.versionName=//p' gradle.properties | tr -d '\r' | xargs)"
          if [[ -z "$APP_VERSION" || "$TAG_VERSION" != "$APP_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match app.versionName ($APP_VERSION)"
            exit 1
          fi

      - name: Run unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Prepare release keystore
        shell: bash
        run: |
          if [[ -z "${{ secrets.NovelRegEx_KEYSTORE_BASE64 }}" ]]; then
            echo "NovelRegEx_KEYSTORE_BASE64 secret is required for release builds."
            exit 1
          fi
          echo "${{ secrets.NovelRegEx_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

      - name: Build signed release APK
        run: ./gradlew :app:buildReleaseApk

      - name: Verify APK
        shell: bash
        run: |
          shopt -s nullglob
          APKS=(apk/NovelRegEx-*.apk)
          if (( ${#APKS[@]} != 1 )); then
            echo "Expected exactly one release APK, found ${#APKS[@]}"
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi
          unzip -t "${APKS[0]}" >/dev/null

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovelRegEx-${{ github.ref_name }}
          path: apk/NovelRegEx-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apk/NovelRegEx-*.apk
          name: NovelRegEx ${{ github.ref_name }}
